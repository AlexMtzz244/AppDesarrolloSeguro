name: SecureCampus LAB-006
on:
  push:
    paths:
      - 'docs/security/SC-LAB-006-securecampus/**'
      - '.github/workflows/sc-lab-006-security.yml'
  pull_request:
    paths:
      - 'docs/security/SC-LAB-006-securecampus/**'
      - '.github/workflows/sc-lab-006-security.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/security/SC-LAB-006-securecampus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q
      - name: Dependency audit
        run: python -m pip_audit -r requirements.txt
