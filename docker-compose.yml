# SecureCampus — entorno de desarrollo reproducible.
#
# Ningun servicio de datos publica su puerto en 0.0.0.0: se enlazan a 127.0.0.1
# para que no queden expuestos en la red local del equipo (RNFS-057).
# Ninguna credencial aparece literal aqui; todas vienen de .env (RNFS-052).

name: securecampus

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Usado por el script de inicializacion para crear el rol de aplicacion
      # con permisos restringidos sobre la bitacora (RNFS-031).
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_datos:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_datos:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Almacenamiento privado compatible con S3. El bucket NO es publico:
  # la entrega siempre pasa por el endpoint de la API, que autoriza antes de
  # leer el objeto (RNFS-040, RNFS-042).
  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_datos:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20

  # Crea los buckets privados una sola vez y termina.
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET_DOCUMENTOS: ${S3_BUCKET_DOCUMENTOS}
      S3_BUCKET_CUARENTENA: ${S3_BUCKET_CUARENTENA}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$S3_ACCESS_KEY_ID $$S3_SECRET_ACCESS_KEY &&
      mc mb --ignore-existing local/$$S3_BUCKET_DOCUMENTOS &&
      mc mb --ignore-existing local/$$S3_BUCKET_CUARENTENA &&
      mc anonymous set none local/$$S3_BUCKET_DOCUMENTOS &&
      mc anonymous set none local/$$S3_BUCKET_CUARENTENA &&
      echo 'Buckets privados listos'
      "

  # Antivirus para la cuarentena de documentos (RNFS-046).
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav_datos:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  # Servidor SMTP local. Permite verificar que el enlace de recuperacion y las
  # notificaciones salen, sin enviar correo real (RF-010, RF-046).
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: desarrollo
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      CLAMAV_HOST: clamav
      SMTP_HOST: mailpit
    ports:
      - "127.0.0.1:${API_PUERTO:-3001}:3001"
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/api/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: desarrollo
    restart: unless-stopped
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${API_PUERTO:-3001}
    ports:
      - "127.0.0.1:${WEB_PUERTO:-3000}:3000"
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/apps/web/.next
    depends_on:
      - api

  # --- Perfil `endurecido` (SC-LAB-008, Paso 8) ---------------------------------
  #
  # Mismas piezas que `api` y `web`, pero con la imagen de PRODUCCION y los
  # controles de contenedor que pide el laboratorio:
  #
  #   user node            no corre como administrador (la imagen ya trae USER node)
  #   read_only            sistema de archivos raiz de solo lectura
  #   cap_drop: ALL        sin capacidades de Linux; no hace falta ninguna
  #   no-new-privileges    un binario setuid no puede elevar privilegios
  #   tmpfs                unico lugar escribible, en memoria y sin persistir
  #   127.0.0.1:puerto     solo accesible desde la propia maquina
  #
  # Sin montajes del codigo: lo que corre es lo que se construyo. Los servicios
  # de arriba (`api`, `web`) son de desarrollo y no llevan estos controles
  # porque necesitan escribir sobre el codigo montado.
  #
  # Uso (no arranca por defecto):
  #   docker compose --profile endurecido up --build -d api-endurecido web-endurecido
  #
  # La imagen de produccion se niega a arrancar sin HTTPS: exige cookie Secure y
  # origenes https:// (RNFS-012, RNFS-051). Define en .env los dos valores, que
  # apuntan a un proxy TLS delante de los contenedores:
  #   ORIGEN_WEB_ENDURECIDO=https://campus.ejemplo.mx
  #   URL_API_ENDURECIDA=https://api.campus.ejemplo.mx
  # Al ser la imagen de produccion, tambien aplican las demas reglas de
  # `validarCoherencia` (apps/api/src/config/entorno.ts): PERMITIR_DATOS_SEMILLA
  # en false y un CAPTCHA_PROVEEDOR real. Si faltan, el valor por omision usa el TLD reservado `.invalid`: el perfil
  # no funciona a medias, falla de forma evidente. (Un `:?` obligatorio no sirve
  # aqui: Compose interpola todo el archivo aunque el perfil no este activo y
  # rompería el `docker compose up` de desarrollo.)
  api-endurecido:
    profiles: ["endurecido"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: produccion
    restart: unless-stopped
    user: "node"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
    env_file: .env
    environment:
      NODE_ENV: production
      PERMITIR_DATOS_SEMILLA: "false"
      DATABASE_URL: postgresql://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      CLAMAV_HOST: clamav
      SMTP_HOST: mailpit
      SESION_COOKIE_SECURE: "true"
      CORS_ORIGENES_PERMITIDOS: ${ORIGEN_WEB_ENDURECIDO:-https://definir-origen-web.invalid}
    ports:
      - "127.0.0.1:${API_PUERTO:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  web-endurecido:
    profiles: ["endurecido"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: produccion
      # NEXT_PUBLIC_* se incrusta al compilar, no se lee al arrancar.
      args:
        NEXT_PUBLIC_API_URL: ${URL_API_ENDURECIDA:-https://definir-url-api.invalid}
    restart: unless-stopped
    user: "node"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    # `next start` escribe su cache de imagenes y de renderizado en .next/cache.
    tmpfs: ["/tmp", "/app/apps/web/.next/cache"]
    env_file: .env
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:${WEB_PUERTO:-3000}:3000"
    depends_on:
      - api-endurecido

volumes:
  postgres_datos:
  redis_datos:
  minio_datos:
  clamav_datos:
